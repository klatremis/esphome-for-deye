    name: "${device_type}-Failure status of communication board"
    register_type: holding
    address: 548
    value_type: U_WORD
    accuracy_decimals: 0

  # Battery energy counters and live measurements
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    id: ${device_type}_battery_total_charge
    name: "${device_type}-Total charge of the battery"
    register_type: holding
    address: 516
    value_type: U_DWORD_R
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    id: ${device_type}_battery_total_discharge
    name: "${device_type}-Total discharge of the battery"
    register_type: holding
    address: 518
    value_type: U_DWORD_R
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    id: ${device_type}_battery_temperature
    name: "${device_type}-battery temperature"
    register_type: holding
    address: 586
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - offset: -1000
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    id: ${device_type}_battery_voltage
    name: "${device_type}-battery voltage"
    register_type: holding
    address: 587
    value_type: U_WORD
    unit_of_measurement: "V"
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    id: ${device_type}_battery_capacity
    name: "${device_type}-battery capacity"
    register_type: holding
    address: 588
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    id: ${device_type}_Battery_output_power
    name: "${device_type}-Battery output power"
    register_type: holding
    address: 590
    value_type: S_WORD
    unit_of_measurement: "W"
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    id: ${device_type}_Battery_output_current
    name: "${device_type}-Battery output current"
    register_type: holding
    address: 591
    value_type: S_WORD
    unit_of_measurement: "A"
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

# Writable operating modes
select:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${device_type}-Energy priority"
    address: 141
    value_type: U_WORD
    use_write_multiple: true
    optionsmap:
      Battery first: 0
      Load first: 1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${device_type}-Limit control mode"
    address: 142
    value_type: U_WORD
    use_write_multiple: true
    optionsmap:
      Selling first: 0
      Zero export to load: 1
      Zero export to CT: 2

