# Generated from deye.yaml and packages/deye.yaml; do not edit in the repository.
# Regenerate with: python scripts/sync_legacy.py
# This standalone copy is retained for existing links and manual installations.

# Generic ESP32 + automatic-direction RS485 adapter.
# Override these substitutions in your own device configuration.
substitutions:
  name: deye12
  device_description: "Esphome component for Deye sun-12k-sg04lp3"
  device_type: sun12k
  modbus_controller_id: sg04lp3
  modbus_address: "1"
  update_interval: 20s
  esp32_board: esp32dev
  tx_pin: "17"
  rx_pin: "16"

esphome:
  name: ${name}
  comment: ${device_description}

esp32:
  board: ${esp32_board}
  framework:
    type: arduino

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}

captive_portal:

uart:
  id: mod_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 9600
  stop_bits: 1

modbus:
  id: modbus1
  # For an adapter requiring direction control, configure flow_control_pin here.

# Shared three-phase low-voltage Deye registers. See README for model coverage.
# Register addresses are decimal; bitmasks are hexadecimal.
# Legacy entity names and IDs are intentional: preserve existing HA references.
# Keep filter order: temperature decoding applies offset before scaling.

# Communication and polling
modbus_controller:
  - id: ${modbus_controller_id}
    address: ${modbus_address}
    modbus_id: modbus1
    setup_priority: -10
    update_interval: ${update_interval}

# Writable switches
switch:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${device_type}_Solar_sell"
    entity_category: config
    icon: "mdi:toggle-switch"
    register_type: holding
    address: 145
    bitmask: 0x0001
    use_write_multiple: true

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${device_type}-Grid_Charge"
    entity_category: config
    icon: "mdi:toggle-switch"
    register_type: holding
    address: 130
    bitmask: 0x0001
    use_write_multiple: true

  - platform: modbus_controller
