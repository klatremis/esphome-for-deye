name: ESPHome build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned ESPHome
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare dummy Wi-Fi credentials
        run: cp tests/secrets.example.yaml secrets.yaml
      - name: Validate configuration
        run: esphome config "esphome config 10-8-2023.yaml"
      - name: Compile firmware (no upload)
        run: esphome compile "esphome config 10-8-2023.yaml"
